services:
  redis:
    image: redis:6.2-alpine
    container_name: redis
    restart: always
    command: redis-server --save 20 1 --loglevel notice
    volumes:
      - redis-cache:/data
    networks:
      - goaccess
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  goaccess:
    image: goaccess_server
    container_name: goaccess
    restart: always
    command: >
      /app/app.py
    env_file: ".env"
    networks:
      - goaccess
    volumes:
      - data:/app/data
      - /etc/goaccess/config.yaml:/etc/goaccess/config.yaml
      - maxmind_geodata:/app/geodb:ro
      - /var/geodb/:/app/geodb:ro
    healthcheck:
      test: ["CMD", "curl", "-4sf", "http://localhost:3050/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  redis-cache:
    driver: local
  data:
    driver: local
  maxmind_geodata:
    driver: local

networks:
  goaccess:
    driver: bridge
